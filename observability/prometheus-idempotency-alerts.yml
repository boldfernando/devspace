groups:
  - name: devspace-idempotency
    interval: 30s
    rules:
      - alert: DevSpaceIdempotencyAmbiguousOutcome
        expr: sum by (tool) (increase(mcp_idempotency_ambiguous_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
          service: devspace-mcp
          runbook: idempotency-ambiguous
        annotations:
          summary: "Outcome ambíguo em operação idempotente"
          description: "A ferramenta {{ $labels.tool }} possui efeito possivelmente executado sem confirmação persistida. Bloquear retry automático e iniciar reconciliação."

      - alert: DevSpaceIdempotencyLeaseLost
        expr: sum by (tool) (increase(mcp_idempotency_lease_lost_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
          service: devspace-mcp
          runbook: idempotency-lease-lost
        annotations:
          summary: "Lease de idempotência perdido"
          description: "A ferramenta {{ $labels.tool }} tentou finalizar sem fencing token válido. Investigar possível bypass ou concorrência incorreta."

      - alert: DevSpaceIdempotencyPendingTooOld
        expr: max by (tool) (mcp_idempotency_pending_age_seconds) > 600
        for: 2m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: idempotency-pending-recovery
        annotations:
          summary: "Registro pending acima de duas vezes o lease"
          description: "A ferramenta {{ $labels.tool }} possui pending com idade superior ao limite operacional inicial de 10 minutos. Verificar crash, worker lento ou SQLite bloqueado."

      - alert: DevSpaceSQLiteContention
        expr: sum by (operation) (increase(sqlite_busy_total[5m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: sqlite-contention
        annotations:
          summary: "Contenção SQLite no servidor MCP"
          description: "A operação {{ $labels.operation }} acumulou pelo menos cinco eventos busy em cinco minutos. Verificar WAL, duração das transações e writers concorrentes."

      - alert: DevSpaceIdempotencyEffectsExceedOwners
        expr: sum by (tool) (increase(mcp_idempotency_effect_total{outcome="started"}[5m])) > sum by (tool) (increase(mcp_idempotency_claim_total{outcome="owner"}[5m]))
        for: 2m
        labels:
          severity: critical
          service: devspace-mcp
          runbook: idempotency-effect-bypass
        annotations:
          summary: "Efeitos excedem claims proprietários"
          description: "A ferramenta {{ $labels.tool }} iniciou mais efeitos do que claims owner no intervalo. Investigar bypass do store ou retry duplicado."

      - alert: DevSpaceIdempotencyConflictBurst
        expr: sum by (tool) (increase(mcp_idempotency_conflict_total[10m])) >= 10
        for: 5m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: idempotency-conflict
        annotations:
          summary: "Burst de conflitos de idempotência"
          description: "A ferramenta {{ $labels.tool }} registrou pelo menos dez reutilizações de key com payload diferente em dez minutos. Verificar cliente, retry policy ou abuso."

  - name: devspace-oauth-device
    interval: 30s
    rules:
      - alert: DevSpaceOAuthDeviceSlowDown
        expr: sum(increase(mcp_oauth_device_event_total{outcome="slow_down"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: oauth-device-rate-limit
        annotations:
          summary: "Device Flow sofreu slow_down"
          description: "O polling do Device Flow atingiu o limite operacional. Respeitar Retry-After e verificar cliente, carga ou abuso."

      - alert: DevSpaceOAuthDeviceRejected
        expr: sum(increase(mcp_oauth_device_event_total{outcome="rejected"}[5m])) >= 5
        for: 2m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: oauth-device-rejection
        annotations:
          summary: "Burst de rejeições no Device Flow"
          description: "O Device Flow acumulou rejeições acima do limiar inicial de operação. Verificar resource, scopes, identidade e cliente."

      - alert: DevSpaceOAuthDeviceExpired
        expr: sum(increase(mcp_oauth_device_event_total{outcome="expired"}[5m])) > 0
        for: 0m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: oauth-device-expired
        annotations:
          summary: "Device Authorization expirou"
          description: "Uma autorização Device expirou antes do consumo. Verificar tempo de aprovação, polling e disponibilidade do gateway."

  - name: devspace-application
    interval: 30s
    rules:
      - alert: DevSpaceHTTPServerErrorRate
        expr: sum(rate(devspace_http_requests_total{outcome="server_error"}[5m])) / clamp_min(sum(rate(devspace_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
          service: devspace-mcp
          runbook: http-server-errors
        annotations:
          summary: "Taxa de erros 5xx elevada"
          description: "A taxa de respostas 5xx do DevSpace excedeu 5% por cinco minutos. Correlacionar request_id, categoria de erro e dependência afetada."

      - alert: DevSpaceMcpToolLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, tool) (rate(devspace_mcp_tool_duration_ms_bucket[5m]))) > 1000
        for: 10m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: mcp-tool-latency
        annotations:
          summary: "Latência p95 elevada em ferramenta MCP"
          description: "A latência p95 da ferramenta {{ $labels.tool }} excedeu 1 segundo por dez minutos. Verificar filesystem, processo, SQLite e carga concorrente."

      - alert: DevSpaceMcpAuthDeniedBurst
        expr: sum(increase(devspace_mcp_auth_denied_total[5m])) >= 10
        for: 2m
        labels:
          severity: warning
          service: devspace-mcp
          runbook: mcp-auth-denials
        annotations:
          summary: "Burst de falhas de autenticação/autorização MCP"
          description: "O servidor acumulou pelo menos dez negações MCP em cinco minutos. Investigar resource, scopes, binding de sessão e possível cliente mal configurado."

      - alert: DevSpaceReadinessFailed
        expr: devspace_health_status{component="database"} == 0
        for: 2m
        labels:
          severity: critical
          service: devspace-mcp
          runbook: readiness-failed
        annotations:
          summary: "Readiness do banco SQLite falhou"
          description: "O check de readiness do banco não está saudável. Retirar a instância do tráfego e verificar filesystem, lock, storage e recuperação do estado."
