name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: OAuth device store contract
        run: npm run test:oauth-device
      - name: OAuth device HTTP E2E
        run: npm run e2e:oauth-device
      - name: OAuth device CLI E2E
        run: npm run e2e:oauth-device-cli

      - name: Canonical 360 contract tests
        run: npm run test:prd-reverse
      - name: Canonical 360 self-scan
        run: npm run prd:reverse
      - name: Upload Canonical 360 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-360-${{ matrix.os }}
          path: artifacts/canonical-360/
          if-no-files-found: ignore
      - name: Bundle budget gate
        run: npm run bundle:audit:check

      - name: Bundle audit module tests
        run: npm run test:bundle-audit
      - name: End-to-end HTTP/MCP OAuth P0
        run: npm run e2e

      - name: MCP monitor contract E2E
        run: npm run test:mcp-monitor

      - name: Upload MCP monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-monitor-contract-${{ matrix.os }}
          path: artifacts/mcp-monitor-contract.json
          if-no-files-found: ignore

      - name: Block 1 identity and authorization E2E
        run: npm run e2e:block1:identity

      - name: Upload Block 1 identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block1-identity-${{ matrix.os }}
          path: artifacts/block1-identity-report.json
          if-no-files-found: ignore

      - name: OAuth/MCP P0 negative matrix
        run: npm run security:p0
      - name: Upload OAuth/MCP security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-mcp-negative-security-${{ matrix.os }}
          path: |
            artifacts/oauth-mcp-negative-report.json
            artifacts/e2e-security-summary.md
      - name: Coverage gate
        run: npm run coverage:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore

      - name: Upload UI bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-bundle-report-${{ matrix.os }}
          path: artifacts/ui-bundle-report.json
          if-no-files-found: ignore

      - name: Doctor
        run: node dist/cli.js doctor

  staging-load:
    name: Staging authenticated load
    if: github.event_name == "schedule" || github.event_name == "workflow_dispatch" || (github.event_name == "push" && github.ref == "refs/heads/main")
    runs-on: ubuntu-latest
    env:
      CI: true
      DEVSPACE_ENV: staging
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-staging-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:17677
      MCP_LOAD_SAMPLES: "20"
      MCP_LOAD_CONCURRENCY: "4"
      MCP_LOAD_REPORT: artifacts/mcp-load-log.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build staging artifact
        run: npm run build
      - name: Bundle budget gate
        run: npm run bundle:audit:check
      - name: Observability contract gate
        run: npm run test:observability
      - name: Authenticated MCP sustained load
        run: npm run mcp:load:log
      - name: Coverage gate
        run: npm run coverage:check
      - name: Doctor
        run: node dist/cli.js doctor
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-authenticated-load
          path: |
            artifacts/mcp-load-log.json
            artifacts/ui-bundle-report.json
            artifacts/observability-contract-report.json
            coverage/
          if-no-files-found: ignore
