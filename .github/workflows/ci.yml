name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget gate
        run: npm run bundle:audit:check

      - name: Bundle audit module tests
        run: npm run test:bundle-audit
      - name: End-to-end HTTP/MCP OAuth P0
        run: npm run e2e

      - name: OAuth/MCP P0 negative matrix
        run: npm run security:p0
      - name: Upload OAuth/MCP security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-mcp-negative-security-${{ matrix.os }}
          path: |
            artifacts/oauth-mcp-negative-report.json
            artifacts/e2e-security-summary.md
      - name: Coverage gate
        run: npm run coverage:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore

      - name: Upload UI bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-bundle-report-${{ matrix.os }}
          path: artifacts/ui-bundle-report.json
          if-no-files-found: ignore

      - name: Doctor
        run: node dist/cli.js doctor
